# ------------------------------------------------------------------------------
# PROYECTO: Bunuelos_TuRedondito
# VERSION: 1.0.0
# DESCRIPCIÓN: Fuente Única de Verdad (SSoT) para el sistema de forecasting.
# ------------------------------------------------------------------------------

project:
  name: "Bunuelos_TuRedondito"
  version: "1.0.0"

# ------------------------------------------------------------------------------
# 1. INFRAESTRUCTURA (STORAGE & CLOUD)
# ------------------------------------------------------------------------------
database:
  supabase:
    env_url: "SUPABASE_URL"
    env_key: "SUPABASE_KEY"
    env_service_key: "SUPABASE_SERVICE_ROLE_KEY"
    s3:
      env_endpoint: "SUPABASE_S3_ENDPOINT"
      env_access_key: "SUPABASE_S3_ACCESS_KEY_ID"
      env_secret_key: "SUPABASE_S3_SECRET_ACCESS_KEY"
      env_region: "SUPABASE_S3_REGION"
      env_bucket: "SUPABASE_S3_BUCKET"

network:
  timeout: 10
  latency_threshold_ms: 2000

# ------------------------------------------------------------------------------
# 2. DATA SOURCES & SEMANTIC CONTRACTS
# ------------------------------------------------------------------------------
tables:
  usr_ventas: "usr_ventas"
  usr_inventario_detallado: "usr_inventario_detallado"
  usr_clima_diario: "usr_clima_diario"
  # Tablas de Sistema (Auditoría)
  sys_validation_contract: "sys_validation_contract"
  sys_pipeline_execution: "sys_pipeline_execution"

# GOBERNANZA DEL CONTRATO
contract:
  mandatory_source: "inventory"
  target_variable: "demanda_teorica_total"
  path: "contracts/contracts/data_contract.yaml"

# PARÁMETROS DE VALIDACIÓN (Etapa 2.1)
validation:
  mode: "auto" # auto, full, incremental
  sample_size: null # null para validar todo el dataframe
  thresholds:
    max_nat_increase_pct: 0.05 # Máximo 5% de incremento en NaT permitido en fechas
  fingerprint:
    algorithm: "sha256"

# ------------------------------------------------------------------------------
# 3. REPORTING & CLOUD TICKETS
# ------------------------------------------------------------------------------
paths:
  reports:
    stage_connector:
      root: "outputs/reports/stage_connector"
      latest: "outputs/reports/stage_connector/connector_report.json"
      history: "outputs/reports/stage_connector/history"
    stage_load:
      root: "outputs/reports/stage_load"
      latest: "outputs/reports/stage_load/load_report.json"
      history: "outputs/reports/stage_load/history"
  
  cloud_storage:
    s3_tickets_prefix: "pipeline_tickets/stage_load"
    s3_ticket_name: "load_report.json"
