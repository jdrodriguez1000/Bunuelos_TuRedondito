# ------------------------------------------------------------------------------
# PROYECTO: Bunuelos_TuRedondito
# VERSION: 1.0.0
# DESCRIPCIÓN: Fuente Única de Verdad (SSoT) para el sistema de forecasting.
# ------------------------------------------------------------------------------

project:
  name: "Bunuelos_TuRedondito"
  version: "1.0.0"

# ------------------------------------------------------------------------------
# 1. INFRAESTRUCTURA (STORAGE & CLOUD)
# ------------------------------------------------------------------------------
database:
  supabase:
    env_url: "SUPABASE_URL"
    env_key: "SUPABASE_KEY"
    env_service_key: "SUPABASE_SERVICE_ROLE_KEY"
    s3:
      env_endpoint: "SUPABASE_S3_ENDPOINT"
      env_access_key: "SUPABASE_S3_ACCESS_KEY_ID"
      env_secret_key: "SUPABASE_S3_SECRET_ACCESS_KEY"
      env_region: "SUPABASE_S3_REGION"
      env_bucket: "SUPABASE_S3_BUCKET"

network:
  timeout: 10
  latency_threshold_ms: 2000

# ------------------------------------------------------------------------------
# 2. DATA SOURCES & SEMANTIC CONTRACTS
# ------------------------------------------------------------------------------
tables:
  usr_ventas: "usr_ventas"
  usr_inventario_detallado: "usr_inventario_detallado"
  usr_clima_diario: "usr_clima_diario"
  usr_ipc_mensual: "usr_ipc_mensual"
  usr_salario_minimo_anual: "usr_salario_minimo_anual"
  # Tablas de Sistema (Auditoría)
  sys_validation_contract: "sys_validation_contract"
  sys_pipeline_execution: "sys_pipeline_execution"
  sys_ingestion_audit: "sys_ingestion_audit"

# GOBERNANZA DEL CONTRATO
contract:
  mandatory_source: "inventory"
  target_variable: "demanda_teorica_total"
  path: "contracts/contracts/data_contract.yaml"

# PARÁMETROS DE VALIDACIÓN (Etapa 2.1)
validation:
  mode: "auto" # auto, full, incremental
  sample_size: null # null para validar todo el dataframe
  thresholds:
    max_nat_increase_pct: 0.05 # Máximo 5% de incremento en NaT permitido en fechas
  fingerprint:
    algorithm: "sha256"

# ------------------------------------------------------------------------------
# 3. REPORTING & CLOUD TICKETS
# ------------------------------------------------------------------------------
paths:
  reports:
    stage_connector:
      root: "outputs/reports/stage_connector"
      latest: "outputs/reports/stage_connector/connector_report.json"
      history: "outputs/reports/stage_connector/history"
    stage_load:
      root: "outputs/reports/stage_load"
      latest: "outputs/reports/stage_load/load_report.json"
      history: "outputs/reports/stage_load/history"
  
  cloud_storage:
    s3_tickets_prefix: "pipeline_tickets/stage_load"
# ------------------------------------------------------------------------------
# 4. INGESTION & HEALTH RULES (Stage 2.2)
# ------------------------------------------------------------------------------
bronze:
  path: "data/bronze"

ingestion:
  tables:
    # Reglas para Inventario Detallado
    usr_inventario_detallado:
      frequency: "D"
      sentinels: [-999, -99.9, -1, "NaN", "nan", "NULL", "null", "None", "", " "]
      custom_rules:
        - name: demanda_teorica
          expression: "demanda_teorica_total == ventas_reales_totales + unidades_agotadas"
        - name: positividad_inventario
          expression: "all_fields >= 0"
        - name: lbs_disponibles
          expression: "abs(lbs_totales_disponibles - (lbs_iniciales_bodega + lbs_recibidas)) <= 0.01"
        - name: ventas_reales_total_composicion
          expression: "ventas_reales_totales == ventas_reales_pagas + ventas_reales_bonificadas"
    
    # Reglas para Ventas
    usr_ventas:
      frequency: "D"
      sentinels: [-999, -99.9, "NaN", "nan", "NULL", "null", "None", "", " "]
      custom_rules:
        - name: balance_unidades
          expression: "abs(unidades_totales - (unidades_pagas + unidades_bonificadas)) <= 0.01"
        - name: regla_promocion
          expression: "es_promocion == 1 => unidades_pagas == unidades_bonificadas"
        - name: positividad_campos
          expression: "all_fields >= 0"
    
    # Reglas para Clima
    usr_clima_diario:
      frequency: "D"
      sentinels: [-999, -99.9, "NaN", "nan", "NULL", "null", "None", "unknown", "N/A"]
      custom_rules:
        - name: consistencia_sin_lluvia
          expression: "precipitacion_mm == 0 => (tipo_lluvia == 'Ninguna' and es_dia_lluvioso == 0)"
        - name: categorias_tipo_lluvia
          expression: "tipo_lluvia in ['Ninguna', 'Moderada', 'Fuerte', 'Ligera']"
        - name: categorias_evento_macro
          expression: "evento_macro in ['La Niña', 'Neutral', 'El Niño']"
        - name: binario_es_dia_lluvioso
          expression: "es_dia_lluvioso in [0, 1]"
        - name: positividad_clima
          expression: "(temperatura_media >= 0) and (precipitacion_mm >= 0) and (probabilidad_lluvia >= 0)"

    # Reglas para IPC
    usr_ipc_mensual:
      frequency: "M"
      sentinels: [-999, -99.9, "NaN", "nan", "NULL", "null", "None", "", " "]
      custom_rules:
        - name: positividad_ipc
          expression: "inflacion_mensual_ipc >= 0"
        - name: rango_ipc
          expression: "inflacion_mensual_ipc <= 100" # Asumiendo un límite superior razonable para inflación

    # Reglas para Salario Mínimo
    usr_salario_minimo_anual:
      frequency: "Y"
      sentinels: [-999, -99.9, "NaN", "nan", "NULL", "null", "None", "", " "]
      custom_rules:
        - name: positividad_smlv
          expression: "smlv >= 0"


  # MODELO DE SCORING PONDERADO (Weighted Aggregate Score)
  scoring:
    weights:
      business_rules: 0.50   # Crítico: Reglas de negocio (50%)
      time_continuity: 0.20  # Relevante: Gaps y Freshness (20%)
      data_integrity: 0.20   # Relevante: Nulos y Fechas Corruptas (20%)
      data_cleaning: 0.10    # Higiene: Duplicados y Centinelas (10%)
    penalties:
      per_custom_rule_violation_pct: 2.0  # % de regs que fallan * este factor
      per_gap_day: 5                     # Puntos menos por cada día de hueco
      per_invalid_date: 10               # Puntos menos por cada fecha NaT
      max_null_pct_allowed: 1.0           # Umbral de tolerancia de nulos
