name: Daily Data Pipeline

on:
  schedule:
    # 07:00 UTC es 02:00 AM Hora Colombia (UTC-5)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  run-pipeline:
    name: Execute Daily Load
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para DVC y Git log

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DVC Remote
        env:
          DVC_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          DVC_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          dvc remote modify storage access_key_id "$DVC_ACCESS_KEY_ID"
          dvc remote modify storage secret_access_key "$DVC_SECRET_ACCESS_KEY"

      - name: Run Data Pipeline (Load)
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python main.py load

      - name: Auto-commit DVC changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .dvc/*.dvc data/bronze/.gitignore
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update dvc pointers [skip ci]"
          git push origin main
