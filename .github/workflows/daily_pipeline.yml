name: Daily Data Pipeline

on:
  schedule:
    # 07:00 UTC es 02:00 AM Hora Colombia (UTC-5)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  run-pipeline:
    name: Execute Daily Load
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para DVC y Git log

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git Identity
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Configure DVC Remote
        env:
          DVC_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          DVC_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          # Usar --local evita que las llaves se escriban en .dvc/config del repo
          dvc remote modify storage --local access_key_id "$DVC_ACCESS_KEY_ID"
          dvc remote modify storage --local secret_access_key "$DVC_SECRET_ACCESS_KEY"

      - name: Run Data Pipeline (Load)
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_S3_BUCKET: ${{ secrets.SUPABASE_S3_BUCKET }}
        run: |
          python main.py load

      - name: Auto-commit DVC changes
        run: |
          # Agregar archivos .dvc y .gitignore de datos si fueron actualizados
          git add data/**/*.dvc 2>/dev/null || true
          git add data/**/.gitignore 2>/dev/null || true
          git add .gitignore 2>/dev/null || true
          
          # Solo hacer commit si hay cambios en el area de stage
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update dvc pointers [skip ci]"
            git push origin HEAD
          else
            echo "No changes to commit (DVC pointers are up to date)"
          fi
