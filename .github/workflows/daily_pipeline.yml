name: Daily Data Pipeline

on:
  schedule:
    # 08:30 UTC es 03:30 AM Hora Colombia (UTC-5)
    - cron: '30 8 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  run-pipeline:
    name: Execute Daily Load
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para DVC y Git log

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git Identity
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Configure DVC Remote
        env:
          DVC_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          DVC_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          # Usar --local evita que las llaves se escriban en .dvc/config del repo
          dvc remote modify storage --local access_key_id "$DVC_ACCESS_KEY_ID"
          dvc remote modify storage --local secret_access_key "$DVC_SECRET_ACCESS_KEY"

      - name: Pull Base Data from DVC (for Incremental Load)
        run: |
          # Descarga los archivos .parquet de la última ejecución desde Supabase Storage.
          # Sin este paso, el runner no tendría la base local y caería a carga FULL cada día.
          dvc pull || echo "DVC pull warning: algunos archivos pueden no estar disponibles. Continuando..."

      - name: Run Data Pipeline (Load)
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_S3_BUCKET: ${{ secrets.SUPABASE_S3_BUCKET }}
        run: |
          python main.py load
